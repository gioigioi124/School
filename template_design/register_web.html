<!doctype html>

<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Đăng ký tài khoản - Kinderly</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&amp;family=Quicksand:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary-fixed-variant": "#005046",
              "surface-container-highest": "#e1e3e2",
              "inverse-on-surface": "#eff1f0",
              tertiary: "#24657e",
              "on-secondary-fixed": "#251a00",
              "outline-variant": "#bdc9c5",
              "secondary-fixed": "#ffdf96",
              "on-tertiary-container": "#105971",
              "error-container": "#ffdad6",
              "on-tertiary-fixed": "#001f2a",
              "on-tertiary-fixed-variant": "#004d64",
              "inverse-surface": "#2e3131",
              "tertiary-container": "#92ceea",
              "inverse-primary": "#76d7c4",
              "tertiary-fixed": "#bde9ff",
              "surface-container-low": "#f2f4f3",
              primary: "#006b5d",
              surface: "#f8faf9",
              outline: "#6e7a76",
              "on-primary-container": "#005d51",
              "surface-dim": "#d8dada",
              "secondary-container": "#ffd97d",
              "surface-container-lowest": "#ffffff",
              "on-secondary-container": "#785d09",
              "primary-fixed-dim": "#76d7c4",
              "surface-container": "#eceeed",
              "on-error-container": "#93000a",
              "secondary-fixed-dim": "#e7c269",
              "on-error": "#ffffff",
              background: "#f8faf9",
              "surface-bright": "#f8faf9",
              "primary-container": "#76d7c4",
              "on-primary-fixed": "#00201b",
              secondary: "#765b06",
              "surface-variant": "#e1e3e2",
              "tertiary-fixed-dim": "#93cfeb",
              "on-secondary": "#ffffff",
              "on-surface": "#191c1c",
              "on-surface-variant": "#3e4946",
              "primary-fixed": "#93f4e0",
              "on-background": "#191c1c",
              "on-secondary-fixed-variant": "#594400",
              error: "#ba1a1a",
              "surface-container-high": "#e6e9e8",
              "surface-tint": "#006b5d",
              "on-tertiary": "#ffffff",
              "on-primary": "#ffffff",
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
            spacing: {
              "margin-desktop": "32px",
              gutter: "24px",
              base: "8px",
              "margin-mobile": "16px",
              "container-max-width": "1200px",
            },
            fontFamily: {
              "label-md": ["Lexend"],
              "body-lg": ["Lexend"],
              "body-md": ["Lexend"],
              "headline-lg-mobile": ["Quicksand"],
              "headline-md": ["Quicksand"],
              "display-lg": ["Quicksand"],
              "headline-lg": ["Quicksand"],
            },
            fontSize: {
              "label-md": [
                "14px",
                {
                  lineHeight: "20px",
                  letterSpacing: "0.01em",
                  fontWeight: "700",
                },
              ],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "headline-lg-mobile": [
                "28px",
                { lineHeight: "36px", fontWeight: "700" },
              ],
              "headline-md": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              "display-lg": [
                "48px",
                {
                  lineHeight: "56px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "headline-lg": [
                "32px",
                { lineHeight: "40px", fontWeight: "700" },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 1,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .input-focus:focus-within {
        border-color: #006b5d;
      }
    </style>
  </head>
  <body
    class="bg-background text-on-background min-h-screen flex items-center justify-center p-4"
  >
    <main
      class="w-full max-w-[1000px] bg-surface-container-lowest rounded-xl shadow-[0_4px_40px_rgba(0,0,0,0.08)] overflow-hidden flex flex-col md:flex-row"
    >
      <!-- Left Column: Illustration (Desktop Only) -->
      <div
        class="hidden md:flex md:w-1/2 bg-surface-container p-12 flex-col justify-center items-center relative overflow-hidden"
      >
        <!-- Decorative blobs -->
        <div
          class="absolute top-[-50px] left-[-50px] w-64 h-64 bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-50"
        ></div>
        <div
          class="absolute bottom-[-50px] right-[-50px] w-64 h-64 bg-secondary-container rounded-full mix-blend-multiply filter blur-3xl opacity-50"
        ></div>
        <img
          class="relative z-10 w-full max-w-sm rounded-lg object-contain"
          data-alt="A charming, soft pastel-toned illustration of a friendly teacher surrounded by happy children in a colorful, modern classroom setting. The style is soft minimalist flat art, utilizing mint green and warm yellow hues against a clean white background. The scene conveys a sense of joy, nurturing, and effortless classroom management."
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuA3WYYbQ1rq6ZQUaTwYkFT8Hx1aaTF7446HrPeEE7cEcIb0s6we3znrMd3IlCZD4VQJE6tKKE0JgNDdTXtxoQYQFwjeqb-6ggXlZi-kAAcpVv_peO-6y5d3lhXoFUIqprlp9uKp7gOD1FUtRCOwMdKlBzV7Xwl9jkWHOoDHkdTbKpaK4ssYXeTGPsjJKyn_PaTtHoZQmQJdjAHoBYCFgcX8UtHf7dIkVnsE4hmTDcg1DpEwJLZEgI8wMQ"
        />
        <div class="relative z-10 text-center mt-8 space-y-4">
          <h2 class="font-headline-lg text-headline-lg text-primary">
            Kinderly
          </h2>
          <p class="font-body-md text-body-md text-on-surface-variant">
            Giúp việc quản lý lớp học trở nên nhẹ nhàng và tràn ngập niềm vui.
          </p>
        </div>
      </div>
      <!-- Right Column: Registration Form -->
      <div
        class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center bg-surface-container-lowest"
      >
        <div class="mb-8">
          <h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">
            Đăng ký tài khoản
          </h1>
          <p class="font-body-md text-body-md text-on-surface-variant">
            Tham gia Kinderly để bắt đầu hành trình tuyệt vời cùng các bé.
          </p>
        </div>
        <form class="space-y-6">
          <!-- Name Field -->
          <div class="space-y-2">
            <label
              class="block font-label-md text-label-md text-on-surface"
              for="fullname"
              >Họ và tên</label
            >
            <div
              class="relative input-focus border-2 border-outline-variant rounded-lg overflow-hidden transition-colors bg-surface-container-lowest"
            >
              <div
                class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
              >
                <span class="material-symbols-outlined text-outline"
                  >person</span
                >
              </div>
              <input
                class="block w-full pl-12 pr-4 py-3 border-transparent focus:border-transparent focus:ring-0 bg-transparent font-body-md text-body-md text-on-surface"
                id="fullname"
                placeholder="Nhập họ và tên của bạn"
                type="text"
              />
            </div>
          </div>
          <!-- Email Field -->
          <div class="space-y-2">
            <label
              class="block font-label-md text-label-md text-on-surface"
              for="email"
              >Email</label
            >
            <div
              class="relative input-focus border-2 border-outline-variant rounded-lg overflow-hidden transition-colors bg-surface-container-lowest"
            >
              <div
                class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
              >
                <span class="material-symbols-outlined text-outline">mail</span>
              </div>
              <input
                class="block w-full pl-12 pr-4 py-3 border-transparent focus:border-transparent focus:ring-0 bg-transparent font-body-md text-body-md text-on-surface"
                id="email"
                placeholder="Nhập email của bạn"
                type="email"
              />
            </div>
          </div>
          <!-- School Field -->
          <div class="space-y-2">
            <label
              class="block font-label-md text-label-md text-on-surface"
              for="school"
              >Tên trường</label
            >
            <div
              class="relative input-focus border-2 border-outline-variant rounded-lg overflow-hidden transition-colors bg-surface-container-lowest"
            >
              <div
                class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
              >
                <span class="material-symbols-outlined text-outline"
                  >school</span
                >
              </div>
              <input
                class="block w-full pl-12 pr-4 py-3 border-transparent focus:border-transparent focus:ring-0 bg-transparent font-body-md text-body-md text-on-surface"
                id="school"
                placeholder="Nhập tên trường mầm non"
                type="text"
              />
            </div>
          </div>
          <!-- Password Field -->
          <div class="space-y-2">
            <label
              class="block font-label-md text-label-md text-on-surface"
              for="password"
              >Mật khẩu</label
            >
            <div
              class="relative input-focus border-2 border-outline-variant rounded-lg overflow-hidden transition-colors bg-surface-container-lowest"
            >
              <div
                class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
              >
                <span class="material-symbols-outlined text-outline">lock</span>
              </div>
              <input
                class="block w-full pl-12 pr-4 py-3 border-transparent focus:border-transparent focus:ring-0 bg-transparent font-body-md text-body-md text-on-surface"
                id="password"
                placeholder="Tạo mật khẩu an toàn"
                type="password"
              />
            </div>
          </div>
          <!-- Submit Button -->
          <button
            class="w-full py-4 px-6 bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-[0_4px_12px_rgba(0,107,93,0.2)] hover:bg-on-primary-fixed-variant border-b-4 border-[#005046] active:border-b-0 active:translate-y-1 transition-all duration-200"
            type="submit"
          >
            Đăng ký
          </button>
        </form>
        <div class="mt-8 text-center">
          <p class="font-body-md text-body-md text-on-surface-variant">
            Đã có tài khoản?
            <a
              class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors"
              href="#"
              >Đăng nhập ngay</a
            >
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
