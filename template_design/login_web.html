<!doctype html>

<html class="light" lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Kinderly - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"

    <link

      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-bright": "#f8faf9",
              "secondary-fixed": "#ffdf96",
              "on-secondary-fixed-variant": "#594400",
              "on-tertiary-container": "#105971",
              tertiary: "#24657e",
              "secondary-fixed-dim": "#e7c269",
              outline: "#6e7a76",
              "on-error": "#ffffff",
              "on-primary": "#ffffff",
              "on-secondary": "#ffffff",
              "outline-variant": "#bdc9c5",
              "primary-container": "#76d7c4",
              "on-primary-fixed": "#00201b",
              "on-primary-container": "#005d51",
              "surface-container-lowest": "#ffffff",
              "inverse-surface": "#2e3131",
              "error-container": "#ffdad6",
              "surface-container": "#eceeed",
              "surface-container-low": "#f2f4f3",
              "surface-container-highest": "#e1e3e2",
              "inverse-primary": "#76d7c4",
              surface: "#f8faf9",
              "on-secondary-fixed": "#251a00",
              "on-secondary-container": "#785d09",
              "primary-fixed-dim": "#76d7c4",
              "on-surface": "#191c1c",
              "on-background": "#191c1c",
              secondary: "#765b06",
              "tertiary-container": "#92ceea",
              "tertiary-fixed-dim": "#93cfeb",
              "on-error-container": "#93000a",
              "tertiary-fixed": "#bde9ff",
              "on-surface-variant": "#3e4946",
              "on-tertiary": "#ffffff",
              "secondary-container": "#ffd97d",
              "surface-tint": "#006b5d",
              background: "#f8faf9",
              "surface-dim": "#d8dada",
              "surface-container-high": "#e6e9e8",
              "on-tertiary-fixed-variant": "#004d64",
              "on-primary-fixed-variant": "#005046",
              error: "#ba1a1a",
              "inverse-on-surface": "#eff1f0",
              "primary-fixed": "#93f4e0",
              primary: "#006b5d",
              "surface-variant": "#e1e3e2",
              "on-tertiary-fixed": "#001f2a",
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
            spacing: {
              "margin-desktop": "32px",
              gutter: "24px",
              "container-max-width": "1200px",
              "margin-mobile": "16px",
              base: "8px",
            },
            fontFamily: {
              "body-lg": ["Nunito Sans"],
              "headline-lg": ["Quicksand"],
              "headline-md": ["Quicksand"],
              "label-md": ["Nunito Sans"],
              "display-lg": ["Quicksand"],
              "headline-lg-mobile": ["Quicksand"],
              "body-md": ["Nunito Sans"],
            },
            fontSize: {
              "body-lg": [
                "18px",
                {
                  lineHeight: "28px",
                  fontWeight: "400",
                },
              ],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  fontWeight: "700",
                },
              ],
              "headline-md": [
                "24px",
                {
                  lineHeight: "32px",
                  fontWeight: "600",
                },
              ],
              "label-md": [
                "14px",
                {
                  lineHeight: "20px",
                  letterSpacing: "0.01em",
                  fontWeight: "700",
                },
              ],
              "display-lg": [
                "48px",
                {
                  lineHeight: "56px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "headline-lg-mobile": [
                "28px",
                {
                  lineHeight: "36px",
                  fontWeight: "700",
                },
              ],
              "body-md": [
                "16px",
                {
                  lineHeight: "24px",
                  fontWeight: "400",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .tactile-button {
        border-bottom-width: 4px;
        border-bottom-color: rgba(0, 0, 0, 0.1);
      }
      .tactile-button:active {
        transform: translateY(2px);
        border-bottom-width: 2px;
        margin-bottom: 2px;
      }
    </style>
  </head>
  <body
    class="bg-primary-container min-h-screen flex items-center justify-center font-body-lg text-body-lg text-on-surface p-margin-desktop"
  >
    <div
      class="bg-surface-container-lowest rounded-xl shadow-lg flex flex-col md:flex-row w-full max-w-[1000px] min-h-[600px] overflow-hidden"
    >
      <!-- Illustration Side -->
      <div
        class="hidden md:flex flex-col bg-tertiary-container w-1/2 p-12 justify-between rounded-l-xl relative"
      >
        <div class="z-10">
          <h1
            class="font-display-lg text-display-lg text-on-tertiary-container mb-4"
          >
            Kinderly
          </h1>
          <p
            class="font-headline-md text-headline-md text-on-tertiary-container max-w-sm"
          >
            Nuôi dưỡng lớp học, đơn giản hóa quản lý.
          </p>
        </div>
        <div class="flex-grow flex items-center justify-center">
          <img
            class="w-full max-w-md object-contain z-10"
            data-alt="A delightful, flat-vector style illustration of a happy teacher in a bright, modern classroom setting, surrounded by eager, smiling young students. The art style is cute and approachable, utilizing soft pastels, primarily mint green, sky blue, and sunny yellow, matching the 'Kinderly' brand aesthetic. The mood is joyful and educational."
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBM6FEtZE44Z1qqbA6enXMGmg43l0wbx08ifkzJmd2jnaA0wUFCstBO3y3x2kDDKj3pjh2MfWzqPsLd2qv8vwexYpd7rC4wlpYx-F7boYkwvRD8RwXCYQgMq4CTLcMeEqERBHQMgmukl6nHYH70vgP3YSk1qeof35dshbWCJpBXfj3Uhr4KJQWMeiIiLuKz72aPnjdw-FCS72RhGFE-UxaPeyjmhtza5a-ZT6g62kUktB2os7OMe2graw"
          />
        </div>
        <!-- Abstract decorative elements -->
        <div
          class="absolute top-10 right-10 w-24 h-24 bg-primary-container rounded-full opacity-50 blur-xl"
        ></div>
        <div
          class="absolute bottom-10 left-10 w-32 h-32 bg-secondary-container rounded-full opacity-50 blur-xl"
        ></div>
      </div>
      <!-- Login Form Side -->
      <div
        class="w-full md:w-1/2 p-8 md:p-16 flex flex-col justify-center bg-surface-container-lowest relative rounded-r-xl"
      >
        <div class="md:hidden text-center mb-8">
          <h1
            class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2"
          >
            Kinderly
          </h1>
        </div>
        <h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">
          Chào mừng bạn trở lại!
        </h2>
        <p class="font-body-md text-body-md text-on-surface-variant mb-8">
          Vui lòng nhập thông tin để đăng nhập.
        </p>
        <form class="space-y-6">
          <div>
            <label
              class="block font-label-md text-label-md text-on-surface mb-2"
              for="email"
              >Địa chỉ Email</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 transform -translate-y-1/2 text-on-surface-variant"
                >mail</span
              >
              <input
                class="w-full pl-12 pr-4 py-3 rounded-DEFAULT border-2 border-surface-container-high bg-surface-bright focus:border-primary focus:ring-0 transition-colors font-body-md text-body-md"
                id="email"
                name="email"
                placeholder="teacher@school.edu"
                required=""
                type="email"
              />
            </div>
          </div>
          <div>
            <label
              class="block font-label-md text-label-md text-on-surface mb-2"
              for="password"
              >Mật khẩu</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 transform -translate-y-1/2 text-on-surface-variant"
                >lock</span
              >
              <input
                class="w-full pl-12 pr-4 py-3 rounded-DEFAULT border-2 border-surface-container-high bg-surface-bright focus:border-primary focus:ring-0 transition-colors font-body-md text-body-md"
                id="password"
                name="password"
                placeholder="••••••••"
                required=""
                type="password"
              />
            </div>
          </div>
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input
                class="h-4 w-4 text-primary focus:ring-primary border-surface-container-high rounded text-primary"
                id="remember-me"
                name="remember-me"
                type="checkbox"
              />
              <label
                class="ml-2 block font-body-md text-body-md text-on-surface-variant"
                for="remember-me"
              >
                Ghi nhớ tôi
              </label>
            </div>
            <div class="text-sm">
              <a
                class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors"
                href="#"
                >Quên mật khẩu?</a
              >
            </div>
          </div>
          <div>
            <button
              class="w-full flex justify-center py-4 px-4 rounded-full shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all tactile-button"
              type="submit"
            >
              Đăng nhập
            </button>
          </div>
        </form>
        <div class="mt-8 text-center">
          <p class="font-body-md text-body-md text-on-surface-variant">
            Chưa có tài khoản?
            <a
              class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors"
              href="#"
              >Đăng ký ngay</a
            >
          </p>
        </div>
        <footer
          class="mt-auto pt-12 flex flex-col md:flex-row justify-between items-center text-on-surface-variant font-body-md text-body-md text-sm"
        >
          <p>© 2024 Kinderly.</p>
          <div class="space-x-4 mt-2 md:mt-0">
            <a class="hover:text-primary transition-colors" href="#"
              >Trợ giúp</a
            >
            <a class="hover:text-primary transition-colors" href="#"
              >Quyền riêng tư</a
            >
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
